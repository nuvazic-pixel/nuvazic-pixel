name: GenCAD-AI tests

on:
  push:
    paths:
      - "GenCAD-AI/**"
      - ".github/workflows/gencad-ai-tests.yml"
  pull_request:
    paths:
      - "GenCAD-AI/**"
      - ".github/workflows/gencad-ai-tests.yml"

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GenCAD-AI

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  baseline_001:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[baseline_001]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GenCAD-AI

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GENCAD_LLM_PROVIDER: openai
      GENCAD_LLM_MODEL: gpt-5.6-sol
      GENCAD_RUN_ID: baseline_001
      GENCAD_PROMPT_VERSION: v1
      GENCAD_GIT_COMMIT: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt

      - name: Verify API key is configured
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Repository secret OPENAI_API_KEY is not configured."
            exit 1
          fi

      - name: Run frozen baseline_001
        id: benchmark
        shell: bash
        run: |
          mkdir -p reports/baseline_001
          set +e
          python scripts/run_llm_benchmark.py 2>&1 | tee reports/baseline_001/runner.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gencad-ai-baseline-001
          path: GenCAD-AI/reports/baseline_001/
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce release gate
        if: steps.benchmark.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "::error::baseline_001 did not pass the release gate or the live run failed."
          exit 1

